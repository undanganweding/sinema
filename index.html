    <script>
      (function() {
        try {
          var target = typeof window !== 'undefined' ? window : (typeof globalThis !== 'undefined' ? globalThis : self);
          if (target && target.fetch) {
            var nativeFetch = target.fetch.bind(target);
            var currentFetch = nativeFetch;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || (!desc.set && desc.configurable)) {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return currentFetch;
                },
                set: function(fn) {
                  currentFetch = typeof fn === 'function' ? fn.bind(target) : fn;
                },
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // ignore if environment prevents re-defining
        }
      })();
    </script>
